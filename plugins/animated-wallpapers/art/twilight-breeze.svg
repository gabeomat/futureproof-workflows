<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#15113a"/><stop offset=".42" stop-color="#3a2461"/><stop offset=".68" stop-color="#8a3f6f"/><stop offset=".82" stop-color="#e2774f"/><stop offset="1" stop-color="#f4a85e"/>
</linearGradient>
<radialGradient id="fly"><stop offset="0" stop-color="#fff9b0"/><stop offset=".35" stop-color="#ffe45c" stop-opacity=".8"/><stop offset="1" stop-color="#ffe45c" stop-opacity="0"/></radialGradient>
<path id="leaf" d="M0 0Q8-9 18 0Q8 9 0 0Z"/>
<path id="star" d="M0-6L1.6-1.6L6 0L1.6 1.6L0 6L-1.6 1.6L-6 0L-1.6-1.6Z"/>
<g id="pine"><rect x="-7" y="-30" width="14" height="30" fill="#2a1a33"/><path d="M0-250L48-170H24L62-104H32L78-28H-78L-32-104H-62L-24-170H-48Z"/></g>
<path id="tuft" d="M0 0q-10-20-18-22M0 0q-2-22 0-30M0 0q8-18 18-20" fill="none" stroke-width="4" stroke-linecap="round"/>
</defs>
<style>
.gust{animation:gust 5s ease-in-out infinite}.g2{animation-duration:6.2s;animation-delay:-1.4s}.g3{animation-duration:4.4s;animation-delay:-2.6s}.g4{animation-duration:7s;animation-delay:-3.8s}
@keyframes gust{0%,100%{transform:rotate(-1.5deg)}30%{transform:rotate(5deg)}45%{transform:rotate(3deg)}62%{transform:rotate(6.5deg)}}
.top{animation:top 5s ease-in-out infinite}.p2{animation-duration:6.2s;animation-delay:-1.4s}.p3{animation-duration:4.4s;animation-delay:-2.6s}
@keyframes top{0%,100%{transform:skewX(2deg)}30%{transform:skewX(-7deg)}45%{transform:skewX(-4deg)}62%{transform:skewX(-9deg)}}
.blow{animation:blow 13s linear infinite}.b2{animation-duration:17s;animation-delay:-6s}.b3{animation-duration:10s;animation-delay:-3s}.b4{animation-duration:21s;animation-delay:-14s}.b5{animation-duration:15s;animation-delay:-9s}
@keyframes blow{from{transform:translate(-80px,0)}to{transform:translate(1700px,150px)}}
.wob{animation:wob 2.2s ease-in-out infinite alternate}.o2{animation-duration:3s}
@keyframes wob{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
.tumble{animation:tumble 1.8s linear infinite}.u2{animation-duration:2.6s;animation-direction:reverse}
@keyframes tumble{to{transform:rotate(360deg)}}
.whoosh{stroke-dasharray:170 1500;animation:whoosh 7s linear infinite}.h2{animation-duration:9s;animation-delay:-4s}.h3{animation-duration:11s;animation-delay:-7s}
@keyframes whoosh{from{stroke-dashoffset:1670}to{stroke-dashoffset:0}}
.wander{animation:wander 12s ease-in-out infinite}.a2{animation-duration:16s;animation-delay:-5s}.a3{animation-duration:9s;animation-delay:-3s}
@keyframes wander{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-34px)}50%{transform:translate(84px,6px)}75%{transform:translate(30px,30px)}}
.glim{animation:glim 2.4s ease-in-out infinite alternate}.m2{animation-duration:3.3s;animation-delay:-1s}.m3{animation-duration:1.9s;animation-delay:-.6s}
@keyframes glim{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
.tw{animation:glim 3.4s ease-in-out infinite alternate}
.wag{animation:wag 3s ease-in-out infinite}
@keyframes wag{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}85%{transform:rotate(8deg)}}
.breathe{animation:breathe 3.2s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1.03,1.06)}}
.zz{animation:zz 4.5s ease-in infinite}.z2{animation-delay:-1.5s}.z3{animation-delay:-3s}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translate(30px,-76px) scale(1.2);opacity:0}}
.grass{animation:grass 2.4s ease-in-out infinite alternate}.r2{animation-delay:-1s;animation-duration:3s}
@keyframes grass{from{transform:skewX(-6deg)}to{transform:skewX(20deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1600" height="1000" fill="url(#dusk)"/>
<g fill="#fff"><g transform="translate(140 80)"><g class="tw"><use href="#star"/></g></g><g transform="translate(420 150) scale(.7)"><g class="tw m2"><use href="#star"/></g></g><g transform="translate(700 70)"><g class="tw m3"><use href="#star"/></g></g><g transform="translate(980 170) scale(.8)"><g class="tw"><use href="#star"/></g></g><g transform="translate(1240 90) scale(1.1)"><g class="tw m2"><use href="#star"/></g></g><g transform="translate(1480 200) scale(.7)"><g class="tw m3"><use href="#star"/></g></g><g transform="translate(280 270) scale(.6)"><g class="tw m3"><use href="#star"/></g></g><g transform="translate(1120 300) scale(.6)"><g class="tw"><use href="#star"/></g></g>
<circle cx="560" cy="220" r="1.5"/><circle cx="840" cy="130" r="1.5"/><circle cx="1360" cy="260" r="1.5"/><circle cx="60" cy="210" r="1.5"/><circle cx="1560" cy="70" r="1.5"/><circle cx="640" cy="330" r="1.3"/><circle cx="900" cy="290" r="1.3"/></g>
<!-- wind -->
<g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round">
<path class="whoosh" d="M-60 360C300 300 520 420 820 350S1260 300 1380 340c60 22 60 84 6 86c-40 0-48-44-18-52M1380 340C1480 330 1560 350 1680 330"/>
<path class="whoosh h2" d="M-60 520C240 470 480 560 760 500S1080 470 1180 500c52 18 50 70 6 72c-34 0-42-36-16-44M1180 500C1340 480 1500 520 1680 490"/>
<path class="whoosh h3" d="M-60 220C260 180 560 260 900 200S1400 180 1680 210"/>
</g>
<!-- far hills and trees -->
<path d="M0 700Q260 600 560 680T1120 660T1600 620V1000H0Z" fill="#3b2456"/>
<g fill="#33204d"><g transform="translate(470 668) scale(.5)"><g class="gust g3"><use href="#pine"/></g></g><g transform="translate(540 676) scale(.4)"><g class="gust g2"><use href="#pine"/></g></g><g transform="translate(1040 664) scale(.45)"><g class="gust"><use href="#pine"/></g></g><g transform="translate(1110 660) scale(.55)"><g class="gust g4"><use href="#pine"/></g></g></g>
<path d="M0 790Q300 690 640 770T1240 760T1600 720V1000H0Z" fill="#281a44"/>
<!-- pines, mid -->
<g fill="#1d3a45"><g transform="translate(1290 752) scale(.95)"><g class="gust g2"><g class="top p2"><use href="#pine"/></g></g></g><g transform="translate(1560 726) scale(.8)" fill="#234a52"><g class="gust g3"><g class="top p3"><use href="#pine"/></g></g></g><g transform="translate(60 776) scale(.85)" fill="#234a52"><g class="gust"><g class="top"><use href="#pine"/></g></g></g></g>
<!-- big round tree, left -->
<g transform="translate(250 800)"><g class="gust">
<path d="M-16 0Q-8-90-12-170H12Q8-90 20 0Z" fill="#2a1a33"/><path d="M0-120q-40-30-64-34M2-140q40-30 70-30" fill="none" stroke="#2a1a33" stroke-width="10" stroke-linecap="round"/>
<g transform="translate(0 -170)"><g class="top">
<circle cx="-78" cy="-36" r="62" fill="#1f5a57"/><circle cx="74" cy="-44" r="66" fill="#1f5a57"/><circle cx="0" cy="-104" r="84" fill="#27706a"/><circle cx="-40" cy="-10" r="52" fill="#27706a"/><circle cx="42" cy="-6" r="50" fill="#1f5a57"/>
<circle cx="-24" cy="-128" r="34" fill="#34897d" opacity=".8"/><circle cx="52" cy="-76" r="26" fill="#34897d" opacity=".7"/>
</g></g>
</g></g>
<!-- round tree, right -->
<g transform="translate(1430 770) scale(.82)"><g class="gust g4">
<path d="M-16 0Q-8-90-12-170H12Q8-90 20 0Z" fill="#2a1a33"/>
<g transform="translate(0 -170)"><g class="top p2">
<circle cx="-70" cy="-30" r="58" fill="#7a3a5c"/><circle cx="70" cy="-40" r="62" fill="#7a3a5c"/><circle cx="0" cy="-100" r="80" fill="#96486a"/><circle cx="-36" cy="-8" r="50" fill="#96486a"/><circle cx="40" cy="-6" r="48" fill="#7a3a5c"/><circle cx="-20" cy="-122" r="32" fill="#b55f7c" opacity=".8"/>
</g></g>
</g></g>
<path d="M0 880Q400 800 800 868T1600 846V1000H0Z" fill="#171030"/>
<g stroke="#2a1d4e"><g transform="translate(120 866)"><g class="grass"><use href="#tuft"/></g></g><g transform="translate(420 842)"><g class="grass r2"><use href="#tuft"/></g></g><g transform="translate(640 856)"><g class="grass"><use href="#tuft"/></g></g><g transform="translate(1000 864)"><g class="grass r2"><use href="#tuft"/></g></g><g transform="translate(1240 858)"><g class="grass"><use href="#tuft"/></g></g><g transform="translate(1520 850)"><g class="grass r2"><use href="#tuft"/></g></g></g>
<!-- sleeping fox -->
<g transform="translate(1130 862)">
<g transform="translate(-50 -10)"><g class="wag"><path d="M0 0q-44 4-56-30q-4-18 10-22q28 12 60 26z" fill="#f08a3c"/><path d="M-56-30q-4-18 10-22q10 6 14 14q-14 0-24 8z" fill="#fff3e0"/></g></g>
<g class="breathe"><ellipse cy="-24" rx="56" ry="30" fill="#f79646"/></g>
<circle cx="46" cy="-22" r="26" fill="#f79646"/><path d="M28-40l-4-26l22 12zM60-42l10-24l8 26z" fill="#f08a3c"/><path d="M34 -12q14 16 34 2q-6 14-18 14t-16-16z" fill="#fff3e0"/><circle cx="68" cy="-10" r="4" fill="#2a1a33"/>
<path d="M34-24q6 5 12 0M52-24q6 5 12 0" fill="none" stroke="#2a1a33" stroke-width="3" stroke-linecap="round"/>
<g fill="#ffe9c9" font-family="Georgia,serif" font-weight="700" font-size="26"><g transform="translate(70 -56)"><g class="zz"><text>z</text></g></g><g transform="translate(70 -56)"><g class="zz z2"><text>z</text></g></g><g transform="translate(70 -56)"><g class="zz z3"><text>z</text></g></g></g>
</g>
<!-- leaves on the wind -->
<g transform="translate(0 300)" fill="#ffb24d"><g class="blow"><g class="wob"><g class="tumble"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 420)" fill="#ff7f66"><g class="blow b2"><g class="wob o2"><g class="tumble u2"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 180)" fill="#ffd76a"><g class="blow b3"><g class="wob"><g class="tumble u2"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 540) scale(1.3)" fill="#f79646"><g class="blow b4"><g class="wob o2"><g class="tumble"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 100) scale(.8)" fill="#ff9fb4"><g class="blow b5"><g class="wob"><g class="tumble"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 620)" fill="#ffd76a"><g class="blow b2"><g class="wob"><g class="tumble"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 360) scale(1.2)" fill="#ff9fb4"><g class="blow b4"><g class="wob"><g class="tumble u2"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 240) scale(.9)" fill="#f79646"><g class="blow b5"><g class="wob o2"><g class="tumble"><use href="#leaf"/></g></g></g></g>
<g transform="translate(0 480) scale(.8)" fill="#ffb24d"><g class="blow b3"><g class="wob o2"><g class="tumble u2"><use href="#leaf"/></g></g></g></g>
<!-- fireflies -->
<g fill="url(#fly)">
<g transform="translate(120 700)"><g class="wander"><g class="glim"><circle r="22"/></g></g></g><g transform="translate(360 760)"><g class="wander a2"><g class="glim m2"><circle r="19"/></g></g></g><g transform="translate(520 640)"><g class="wander a3"><g class="glim m3"><circle r="20"/></g></g></g><g transform="translate(900 780)"><g class="wander a2"><g class="glim"><circle r="18"/></g></g></g><g transform="translate(1180 700)"><g class="wander"><g class="glim m2"><circle r="21"/></g></g></g><g transform="translate(1360 800)"><g class="wander a3"><g class="glim m3"><circle r="19"/></g></g></g><g transform="translate(1500 660)"><g class="wander a2"><g class="glim"><circle r="20"/></g></g></g><g transform="translate(700 860)"><g class="wander a3"><g class="glim m2"><circle r="18"/></g></g></g><g transform="translate(40 560)"><g class="wander a2"><g class="glim m3"><circle r="20"/></g></g></g>
</g>
</svg>
