<path d="M0-84C34-50 34 20 24 62H-24C-34 20-34-50 0-84Z" fill="#f4f1ff"/><path d="M0-84C16-68 25-48 28-30H-28C-25-48-16-68 0-84Z" fill="#ff5f7e"/>
<circle cy="-2" r="16" fill="#3fd0ff"/><circle cy="-2" r="16" fill="none" stroke="#b7b0e8" stroke-width="5"/><circle cx="-5" cy="-7" r="4" fill="#fff" opacity=".8"/>
<rect x="-24" y="52" width="48" height="10" rx="4" fill="#b7b0e8"/>
</g></g></g>
<!-- ufo with alien -->
<g transform="translate(1290 300)"><g class="ufo">
<g class="beam"><path d="M-44 30L-120 330H120L44 30Z" fill="url(#beam)"/></g>
<path d="M-56-10a56 60 0 0 1 112 0z" fill="#aef4ff" opacity=".45"/>
<g transform="translate(0 -22)">
<path d="M-14-26q-8-20-18-22M14-26q8-20 18-22" fill="none" stroke="#6fe08a" stroke-width="4" stroke-linecap="round"/><circle cx="-32" cy="-49" r="5" fill="#ffe27a"/><circle cx="32" cy="-49" r="5" fill="#ffe27a"/>
<g transform="translate(26 6)"><g class="wave"><path d="M0 0l16-18" stroke="#6fe08a" stroke-width="7" stroke-linecap="round"/><circle cx="18" cy="-20" r="6" fill="#6fe08a"/></g></g>
<ellipse rx="30" ry="27" fill="#7df09a"/>
<g transform="translate(0 -4)"><g class="blink"><ellipse cx="-12" rx="8" ry="11" fill="#1c1440"/><ellipse cx="12" rx="8" ry="11" fill="#1c1440"/><circle cx="-14" cy="-4" r="3" fill="#fff"/><circle cx="10" cy="-4" r="3" fill="#fff"/></g></g>
<path d="M-7 13q7 6 14 0" fill="none" stroke="#1c1440" stroke-width="3" stroke-linecap="round"/>
</g>
<path d="M-56-10a56 60 0 0 1 112 0" fill="none" stroke="#dffbff" stroke-width="4" opacity=".8"/>
<ellipse cy="8" rx="124" ry="30" fill="#b79cff"/><ellipse cy="2" rx="124" ry="24" fill="#d3c2ff"/><ellipse cy="-8" rx="62" ry="10" fill="#8a6fd8" opacity=".6"/>
<g class="lite"><circle cx="-84" cy="10" r="8" fill="#ffe27a"/></g><g class="lite t2"><circle cx="-30" cy="20" r="8" fill="#ff7fb0"/></g><g class="lite t3"><circle cx="30" cy="20" r="8" fill="#7ff5e0"/></g><g class="lite"><circle cx="84" cy="10" r="8" fill="#ffe27a"/></g>
</g></g>
<!-- astro cat -->
<g transform="translate(250 730)"><g class="tumble">
<path d="M40 30C120 80 60 170 150 190" fill="none" stroke="#b7b0e8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
