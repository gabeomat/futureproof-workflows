<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#090d28"/><stop offset=".6" stop-color="#151b48"/><stop offset="1" stop-color="#2b2c66"/>
</linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#fff6c8" stop-opacity=".7"/><stop offset=".45" stop-color="#f5e39a" stop-opacity=".22"/><stop offset="1" stop-color="#f5e39a" stop-opacity="0"/></radialGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<g id="cloud"><ellipse rx="90" ry="24"/><circle cx="-36" cy="-16" r="26"/><circle cx="14" cy="-26" r="34"/><circle cx="54" cy="-10" r="22"/></g>
<path id="star" d="M0-7L2-2L7 0L2 2L0 7L-2 2L-7 0L-2-2Z"/>
<path id="leaf" d="M0 0Q14-16 34 0Q14 16 0 0Z"/>
</defs>
<style>
.halo{animation:halo 6s ease-in-out infinite alternate}
@keyframes halo{from{transform:scale(.88);opacity:.7}to{transform:scale(1.14);opacity:1}}
.tw{animation:tw 3s ease-in-out infinite alternate}.w2{animation-duration:4.2s;animation-delay:-1.4s}.w3{animation-duration:2.3s;animation-delay:-.8s}.w4{animation-duration:5s;animation-delay:-3s}
@keyframes tw{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
.drift{animation:drift 120s linear infinite}.d2{animation-duration:170s;animation-delay:-70s}.d3{animation-duration:140s;animation-delay:-110s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
.shoot{animation:shoot 13s linear infinite}
@keyframes shoot{0%,86%{transform:translate(0,0);opacity:0}88%{opacity:1}97%{opacity:1}100%{transform:translate(520px,230px);opacity:0}}
.tilt{animation:tilt 7s ease-in-out infinite}.i2{animation-duration:5.5s;animation-delay:-2s}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}}
.blink{animation:blink 5s infinite}.k2{animation-duration:6.4s;animation-delay:-2.2s}.k3{animation-duration:4s;animation-delay:-1s}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%,96%{transform:scaleY(.08)}}
.sway{animation:sway 4s ease-in-out infinite alternate}.s2{animation-duration:5s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.tail{animation:tail 2.8s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-16deg)}to{transform:rotate(20deg)}}
.lamp{animation:lamp 5s steps(1) infinite}.m2{animation-delay:-2s;animation-duration:7s}.m3{animation-delay:-3.5s;animation-duration:9s}
@keyframes lamp{0%{opacity:1}70%{opacity:.55}80%{opacity:1}}
.bat{animation:bat 34s linear infinite}
@keyframes bat{from{transform:translate(1700px,60px)}50%{transform:translate(800px,-40px)}to{transform:translate(-100px,40px)}}
.flap{animation:flap .3s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.3)}}
.zz{animation:zz 4.5s ease-in infinite}.z2{animation-delay:-1.5s}.z3{animation-delay:-3s}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translate(34px,-80px) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1600" height="1000" fill="url(#night)"/>
<g fill="#fff">
