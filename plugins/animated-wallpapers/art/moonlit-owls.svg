</g>
<g fill="#3a3f7a" opacity=".55">
<g transform="translate(0 300)"><g class="drift"><use href="#cloud"/></g></g>
<g transform="translate(0 170) scale(1.4)"><g class="drift d2"><use href="#cloud"/></g></g>
<g transform="translate(0 440) scale(.8)"><g class="drift d3"><use href="#cloud"/></g></g>
</g>
