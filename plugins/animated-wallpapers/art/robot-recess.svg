<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3" fill="#f3d9b8"/></pattern>
<g id="gear"><circle r="60" fill="none" stroke-width="22" pathLength="24" stroke-dasharray="1 1"/><circle r="52"/><circle r="18" fill="#fff6e6"/></g>
<path id="plus" d="M-9 0H9M0-9V9" stroke-width="5" stroke-linecap="round" fill="none"/>
<path id="heart" d="M0 8C-14-2-10-14 0-7C10-14 14-2 0 8Z"/>
</defs>
<style>
.cw{animation:cw 16s linear infinite}.ccw{animation:cw 16s linear infinite reverse}.slow{animation-duration:32s}
@keyframes cw{to{transform:rotate(360deg)}}
.roll{animation:roll 44s linear infinite}
@keyframes roll{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(960px) scaleX(1)}50%{transform:translateX(960px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.wheel{animation:cw 1.6s linear infinite}
.jig{animation:jig .5s ease-in-out infinite alternate}
@keyframes jig{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.blink{animation:blink 4.5s infinite}.k2{animation-delay:-1.7s;animation-duration:5.5s}.k3{animation-delay:-3s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bulb{animation:bulb 1.2s steps(1) infinite}.l2{animation-delay:-.4s}.l3{animation-delay:-.8s}
@keyframes bulb{0%{opacity:1}50%{opacity:.25}}
.hover{animation:hover 3.4s ease-in-out infinite alternate}
@keyframes hover{from{transform:translate(0,-18px) rotate(-3deg)}to{transform:translate(26px,18px) rotate(3deg)}}
.prop{animation:prop .18s linear infinite alternate}
@keyframes prop{from{transform:scaleX(1)}to{transform:scaleX(.15)}}
.look{animation:look 7s ease-in-out infinite}
@keyframes look{0%,100%{transform:translate(0,0)}25%{transform:translate(9px,3px)}50%{transform:translate(-8px,5px)}75%{transform:translate(3px,-6px)}}
.wave{animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
.swing{animation:swing 1s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.glow{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35;transform:scale(.85)}to{opacity:1;transform:scale(1.1)}}
.bounce{animation:bounce .6s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes bounce{from{transform:translateY(0) scale(1.06,.94)}to{transform:translateY(-46px) scale(.96,1.04)}}
.float{animation:float 6s ease-in infinite}.h2{animation-delay:-2s}.h3{animation-delay:-4s}
@keyframes float{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(24px,-150px) scale(1.1);opacity:0}}
.tw{animation:tw 2.6s ease-in-out infinite alternate}.w2{animation-delay:-1s}.w3{animation-delay:-1.8s}
@keyframes tw{from{opacity:.25;transform:scale(.7) rotate(0)}to{opacity:1;transform:scale(1.15) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1600" height="1000" fill="#fff6e6"/>
<rect width="1600" height="1000" fill="url(#dots)"/>
<circle cx="1420" cy="150" r="260" fill="#d8f5ee"/><circle cx="130" cy="420" r="210" fill="#ffe3ea"/><circle cx="1500" cy="760" r="190" fill="#e8e1ff"/><circle cx="640" cy="60" r="150" fill="#fff0bf"/>
<!-- gears, top-left -->
<g transform="translate(96 96)" fill="#ff9fb4" stroke="#ff9fb4"><g class="cw slow"><use href="#gear"/></g></g>
<g transform="translate(228 140) scale(.62)" fill="#7fd9cc" stroke="#7fd9cc"><g class="ccw"><use href="#gear"/></g></g>
<g transform="translate(60 228) scale(.5)" fill="#ffd166" stroke="#ffd166"><g class="ccw"><use href="#gear"/></g></g>
<!-- sparkles -->
<g transform="translate(430 210)" stroke="#ff9fb4"><g class="tw"><use href="#plus"/></g></g>
<g transform="translate(1040 150)" stroke="#7fd9cc"><g class="tw w2"><use href="#plus"/></g></g>
<g transform="translate(1180 560)" stroke="#b79cff"><g class="tw w3"><use href="#plus"/></g></g>
<g transform="translate(330 610)" stroke="#ffd166"><g class="tw w2"><use href="#plus"/></g></g>
<g transform="translate(820 250)" stroke="#b79cff"><g class="tw"><use href="#plus"/></g></g>
<!-- floor -->
<rect y="880" width="1600" height="120" fill="#ffe2c4"/><rect y="880" width="1600" height="10" fill="#f6c99f"/>
<path d="M0 940H1600" stroke="#f6c99f" stroke-width="6" stroke-dasharray="46 34" stroke-linecap="round"/>
<!-- hover bot, top right -->
<g transform="translate(1300 250)"><g class="hover">
<rect x="-4" y="-92" width="8" height="26" fill="#8a6fd8"/><g transform="translate(0 -94)"><g class="prop"><rect x="-58" y="-6" width="116" height="12" rx="6" fill="#b79cff"/></g></g><circle cy="-94" r="8" fill="#8a6fd8"/>
<path d="M-70 10q-26 8-30 34M70 10q26 8 30 34" fill="none" stroke="#e0a81e" stroke-width="9" stroke-linecap="round"/><circle cx="-100" cy="48" r="10" fill="#ff7b6b"/><circle cx="100" cy="48" r="10" fill="#ff7b6b"/>
<circle r="72" fill="#ffc93c"/><path d="M-62 36a72 72 0 0 0 124 0z" fill="#f2b21f"/>
<circle cy="-8" r="38" fill="#fff"/><circle cy="-8" r="38" fill="none" stroke="#3b3550" stroke-width="5"/>
<g transform="translate(0 -8)"><g class="look"><circle r="17" fill="#3b3550"/><circle cx="-6" cy="-6" r="5" fill="#fff"/></g></g>
<path d="M-16 46q16 12 32 0" fill="none" stroke="#3b3550" stroke-width="5" stroke-linecap="round"/>
<g fill="#ff7b6b"><g transform="translate(40 -70)"><g class="float"><use href="#heart"/></g></g><g transform="translate(64 -40)"><g class="float h2"><use href="#heart"/></g></g><g transform="translate(20 -84)"><g class="float h3"><use href="#heart"/></g></g></g>
</g></g>
<!-- waving bot, left -->
<g transform="translate(170 880)">
<rect x="-34" y="-34" width="22" height="34" rx="8" fill="#8a6fd8"/><rect x="12" y="-34" width="22" height="34" rx="8" fill="#8a6fd8"/><rect x="-42" y="-10" width="36" height="12" rx="6" fill="#6d55c0"/><rect x="6" y="-10" width="36" height="12" rx="6" fill="#6d55c0"/>
<g transform="translate(-52 -150)"><path d="M0 0q-26 30-14 70" fill="none" stroke="#8a6fd8" stroke-width="12" stroke-linecap="round"/><circle cx="-14" cy="74" r="12" fill="#ffc93c"/></g>
<g transform="translate(52 -150)"><g class="wave"><path d="M0 0q30-26 34-74" fill="none" stroke="#8a6fd8" stroke-width="12" stroke-linecap="round"/><circle cx="34" cy="-80" r="13" fill="#ffc93c"/></g></g>
<rect x="-56" y="-170" width="112" height="140" rx="22" fill="#b79cff"/>
<rect x="-34" y="-112" width="68" height="56" rx="10" fill="#fff" opacity=".5"/><g transform="translate(0 -84)"><g class="glow"><use href="#heart" fill="#ff7b6b" transform="scale(1.8)"/></g></g>
<rect x="-10" y="-186" width="20" height="18" fill="#8a6fd8"/>
<rect x="-66" y="-286" width="132" height="102" rx="24" fill="#c9b5ff"/><rect x="-50" y="-270" width="100" height="70" rx="14" fill="#3b3550"/>
<g transform="translate(0 -242)"><g class="blink"><rect x="-32" y="-10" width="18" height="20" rx="9" fill="#7ff5e0"/><rect x="14" y="-10" width="18" height="20" rx="9" fill="#7ff5e0"/></g></g>
<path d="M-12-218q12 9 24 0" fill="none" stroke="#7ff5e0" stroke-width="4" stroke-linecap="round"/>
<path d="M-70-240h-12M70-240h12" stroke="#8a6fd8" stroke-width="10" stroke-linecap="round"/>
<path d="M0-286v-22" stroke="#8a6fd8" stroke-width="6"/><g class="bulb"><circle cy="-316" r="10" fill="#ff7b6b"/></g>
</g>
<!-- rolling bot -->
<g transform="translate(350 880)"><g class="roll"><g class="jig">
<g transform="translate(0 -30)"><g class="wheel"><circle r="30" fill="#3b3550"/><circle r="14" fill="#fff6e6"/><path d="M-28 0H28M0-28V28" stroke="#fff6e6" stroke-width="5"/></g></g>
<path d="M-22-52h44l-8 16h-28z" fill="#2aa79b"/>
<g transform="translate(-50 -108)"><g class="swing"><path d="M0 0v40" stroke="#2aa79b" stroke-width="11" stroke-linecap="round"/><circle cy="46" r="11" fill="#ff9fb4"/></g></g>
<g transform="translate(50 -108)"><g class="swing"><path d="M0 0v40" stroke="#2aa79b" stroke-width="11" stroke-linecap="round"/><circle cy="46" r="11" fill="#ff9fb4"/></g></g>
<rect x="-54" y="-150" width="108" height="100" rx="26" fill="#3cc6b8"/>
<rect x="-38" y="-134" width="84" height="52" rx="14" fill="#23303a"/>
<g transform="translate(6 -110)"><g class="blink k2"><circle cx="-18" r="9" fill="#ffe27a"/><circle cx="20" r="9" fill="#ffe27a"/></g></g>
<path d="M-4-92q10 7 20 0" fill="none" stroke="#ffe27a" stroke-width="4" stroke-linecap="round"/>
<g class="bulb l2"><circle cx="-30" cy="-66" r="5" fill="#ff7b6b"/></g><g class="bulb l3"><circle cx="-14" cy="-66" r="5" fill="#ffd166"/></g><g class="bulb"><circle cx="2" cy="-66" r="5" fill="#fff"/></g>
<path d="M0-150v-24" stroke="#2aa79b" stroke-width="6"/><path d="M0-174q-14-8-10-22" fill="none" stroke="#2aa79b" stroke-width="5" stroke-linecap="round"/><g class="bulb l3"><circle cx="-10" cy="-200" r="8" fill="#ffd166"/></g>
</g></g></g>
<!-- tiny bouncing bot, right -->
<g transform="translate(1440 880)"><g class="bounce">
<rect x="-34" y="-62" width="68" height="62" rx="16" fill="#ff8a5c"/><rect x="-22" y="-50" width="44" height="26" rx="8" fill="#23303a"/>
<g transform="translate(0 -37)"><g class="blink k3"><circle cx="-10" r="5.5" fill="#fff"/><circle cx="10" r="5.5" fill="#fff"/></g></g>
<path d="M-8-14q8 6 16 0" fill="none" stroke="#9c3f1f" stroke-width="3.5" stroke-linecap="round"/>
<path d="M0-62v-14" stroke="#e06a3c" stroke-width="5"/><g class="bulb l2"><circle cy="-82" r="7" fill="#7ff5e0"/></g>
<rect x="-26" y="-2" width="18" height="8" rx="4" fill="#e06a3c"/><rect x="8" y="-2" width="18" height="8" rx="4" fill="#e06a3c"/>
</g></g>
</svg>
