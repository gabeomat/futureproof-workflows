<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#bfe6ff"/><stop offset=".5" stop-color="#ffeccb"/><stop offset="1" stop-color="#ffc59e"/>
</linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff6c2" stop-opacity=".95"/><stop offset=".5" stop-color="#ffdd7a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd15c" stop-opacity="0"/></radialGradient>
<g id="cloud"><ellipse rx="78" ry="26"/><circle cx="-34" cy="-18" r="27"/><circle cx="10" cy="-30" r="36"/><circle cx="48" cy="-12" r="24"/></g>
<rect id="ray" x="-7" y="-142" width="14" height="38" rx="7"/>
<g id="flower"><path d="M0 0V-44" stroke="#3f9a4a" stroke-width="5" stroke-linecap="round"/><path d="M0-18q14-10 20 0q-10 8-20 0z" fill="#4fae55"/><circle cx="0" cy="-58" r="9"/><circle cx="11" cy="-48" r="9"/><circle cx="-11" cy="-48" r="9"/><circle cx="7" cy="-37" r="9"/><circle cx="-7" cy="-37" r="9"/><circle cx="0" cy="-47" r="7" fill="#ffd34d"/></g>
</defs>
<style>
.rise{animation:rise 28s ease-in-out infinite alternate}
@keyframes rise{0%{transform:translateY(330px)}70%,100%{transform:translateY(0)}}
.spin{animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.92);opacity:.75}to{transform:scale(1.1);opacity:1}}
.drift{animation:drift 90s linear infinite}
.d2{animation-duration:130s;animation-delay:-60s}.d3{animation-duration:110s;animation-delay:-25s}.d4{animation-duration:150s;animation-delay:-100s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
.fly{animation:fly 46s linear infinite}.f2{animation-duration:58s;animation-delay:-30s}
@keyframes fly{from{transform:translate(-120px,40px)}50%{transform:translate(860px,-30px)}to{transform:translate(1840px,30px)}}
.flap{animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.45)}}
.sway{animation:sway 3.6s ease-in-out infinite alternate}.s2{animation-duration:4.4s;animation-delay:-1.3s}.s3{animation-duration:3.1s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
.roam{animation:roam 30s linear infinite}
@keyframes roam{0%{transform:translate(0,0) scaleX(1)}47%{transform:translate(300px,-16px) scaleX(1)}50%{transform:translate(300px,-16px) scaleX(-1)}97%{transform:translate(0,0) scaleX(-1)}100%{transform:translate(0,0) scaleX(1)}}
.hop{animation:hop .8s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-30px)}}
.ear{animation:ear 2.6s ease-in-out infinite}
@keyframes ear{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-14deg)}90%{transform:rotate(8deg)}}
.flit{animation:flit 16s ease-in-out infinite}.fl2{animation-duration:21s;animation-delay:-8s}
@keyframes flit{0%,100%{transform:translate(0,0)}20%{transform:translate(70px,-50px)}40%{transform:translate(150px,-10px)}60%{transform:translate(90px,-80px)}80%{transform:translate(20px,-40px)}}
.wing{animation:wing .3s ease-in-out infinite alternate}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
.peek{animation:peek 9s ease-in-out infinite}
@keyframes peek{0%,50%,100%{transform:translateY(62px)}60%,90%{transform:translateY(-36px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1600" height="1000" fill="url(#sky)"/>
<g transform="translate(1210 300)"><g class="rise">
<g class="pulse"><circle r="230" fill="url(#glow)"/></g>
<g class="spin" fill="#ffc94a"><use href="#ray"/><use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/><use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/></g>
<circle r="84" fill="#ffd34d"/><circle r="84" fill="none" stroke="#ffbf3a" stroke-width="5"/>
<circle cx="-28" cy="-10" r="8" fill="#6b4a1f"/><circle cx="28" cy="-10" r="8" fill="#6b4a1f"/><circle cx="-25" cy="-13" r="3" fill="#fff"/><circle cx="31" cy="-13" r="3" fill="#fff"/>
<path d="M-24 20q24 24 48 0" fill="none" stroke="#6b4a1f" stroke-width="6" stroke-linecap="round"/>
<circle cx="-48" cy="14" r="11" fill="#ff9f7a" opacity=".7"/><circle cx="48" cy="14" r="11" fill="#ff9f7a" opacity=".7"/>
</g></g>
<g fill="#fff" opacity=".92">
<g transform="translate(0 150)"><g class="drift"><use href="#cloud"/></g></g>
<g transform="translate(0 250) scale(.7)"><g class="drift d2"><use href="#cloud"/></g></g>
<g transform="translate(0 90) scale(1.25)"><g class="drift d3"><use href="#cloud"/></g></g>
<g transform="translate(0 340) scale(.55)"><g class="drift d4"><use href="#cloud"/></g></g>
</g>
<g fill="none" stroke="#5c6f82" stroke-width="4" stroke-linecap="round">
<g transform="translate(0 200)"><g class="fly"><g class="flap"><path d="M-20 0q10-14 20 0q10-14 20 0"/></g><g transform="translate(-46 26) scale(.7)"><g class="flap"><path d="M-20 0q10-14 20 0q10-14 20 0"/></g></g></g></g>
<g transform="translate(0 120) scale(.8)"><g class="fly f2"><g class="flap"><path d="M-20 0q10-14 20 0q10-14 20 0"/></g></g></g>
</g>
<path d="M0 640Q300 520 640 620T1200 600T1600 560V1000H0Z" fill="#c4e79a"/>
<g transform="translate(1360 716)"><g class="peek">
<ellipse cx="-12" cy="-52" rx="8" ry="26" fill="#f1e3d3" transform="rotate(-8 -12 -52)"/><ellipse cx="12" cy="-52" rx="8" ry="26" fill="#f1e3d3" transform="rotate(8 12 -52)"/>
<ellipse cx="-12" cy="-50" rx="3.5" ry="17" fill="#ffb3b8" transform="rotate(-8 -12 -50)"/><ellipse cx="12" cy="-50" rx="3.5" ry="17" fill="#ffb3b8" transform="rotate(8 12 -50)"/>
<circle cy="-14" r="26" fill="#f1e3d3"/><circle cx="-9" cy="-18" r="3.5" fill="#3a2c1e"/><circle cx="9" cy="-18" r="3.5" fill="#3a2c1e"/><circle cy="-9" r="3" fill="#ff8f9c"/>
</g></g>
<path d="M0 740Q260 640 560 720T1100 730T1600 680V1000H0Z" fill="#98d472"/>
<path d="M0 850Q400 770 800 840T1600 820V1000H0Z" fill="#72c25d"/>
<g fill="#ff8fb1"><g transform="translate(70 842)"><g class="sway"><use href="#flower"/></g></g><g transform="translate(520 818) scale(.8)" fill="#ffffff"><g class="sway s2"><use href="#flower"/></g></g><g transform="translate(1180 828)" fill="#b79cff"><g class="sway s3"><use href="#flower"/></g></g><g transform="translate(1450 824) scale(1.15)"><g class="sway s2"><use href="#flower"/></g></g><g transform="translate(1530 822) scale(.75)" fill="#ffd0a1"><g class="sway"><use href="#flower"/></g></g><g transform="translate(980 836) scale(.7)" fill="#ffe27a"><g class="sway s3"><use href="#flower"/></g></g></g>
<g transform="translate(130 826)"><g class="roam"><g class="hop">
<ellipse cx="-36" cy="-30" rx="10" ry="10" fill="#fff"/>
<ellipse cx="0" cy="-28" rx="36" ry="27" fill="#fff"/>
<ellipse cx="-16" cy="-5" rx="19" ry="8" fill="#f3ebe6"/><ellipse cx="16" cy="-5" rx="13" ry="6" fill="#f3ebe6"/>
<g transform="translate(24 -74)"><g class="ear"><ellipse cx="-6" cy="-20" rx="8" ry="24" fill="#fff" transform="rotate(-12 -6 -20)"/><ellipse cx="-6" cy="-18" rx="3.5" ry="16" fill="#ffb3c0" transform="rotate(-12 -6 -18)"/><ellipse cx="10" cy="-20" rx="8" ry="24" fill="#fff" transform="rotate(10 10 -20)"/><ellipse cx="10" cy="-18" rx="3.5" ry="16" fill="#ffb3c0" transform="rotate(10 10 -18)"/></g></g>
<circle cx="27" cy="-58" r="22" fill="#fff"/>
<circle cx="35" cy="-62" r="4" fill="#3a2c1e"/><circle cx="36.5" cy="-63.5" r="1.4" fill="#fff"/><circle cx="48" cy="-55" r="3" fill="#ff8f9c"/><circle cx="30" cy="-50" r="6" fill="#ffc2cc" opacity=".8"/>
</g></g></g>
<g transform="translate(360 700)"><g class="flit"><g class="wing"><ellipse cx="-9" cy="-4" rx="9" ry="12" fill="#ff8a5c"/><ellipse cx="9" cy="-4" rx="9" ry="12" fill="#ff8a5c"/><ellipse cx="-7" cy="8" rx="6" ry="7" fill="#ffc15c"/><ellipse cx="7" cy="8" rx="6" ry="7" fill="#ffc15c"/></g><rect x="-1.5" y="-10" width="3" height="20" rx="1.5" fill="#4a3526"/></g></g>
<g transform="translate(1120 740) scale(.8)"><g class="flit fl2"><g class="wing"><ellipse cx="-9" cy="-4" rx="9" ry="12" fill="#7aa8ff"/><ellipse cx="9" cy="-4" rx="9" ry="12" fill="#7aa8ff"/><ellipse cx="-7" cy="8" rx="6" ry="7" fill="#b9d2ff"/><ellipse cx="7" cy="8" rx="6" ry="7" fill="#b9d2ff"/></g><rect x="-1.5" y="-10" width="3" height="20" rx="1.5" fill="#4a3526"/></g></g>
</svg>
